<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0972e7" />
    <meta
      name="description"
      content="AWS Certified Data Engineer – Associate (DEA-C01) practice questions."
    />
    <title>DEA-C01 Study</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="study-shell" aria-live="polite">
      <article class="question-card" aria-labelledby="question-title">
        <header class="question-header">
          <div class="header-copy">
            <p class="eyebrow">AWS DEA-C01 · PRACTICE</p>
            <h1 id="question-title">Question <span id="question-number">—</span></h1>
          </div>
          <p class="question-count" id="question-count" aria-label="Question progress">— / —</p>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </header>

        <section class="question-body" id="question-body">
          <div class="loading-state" id="loading-state">
            <span class="loading-dot" aria-hidden="true"></span>
            Loading question…
          </div>
          <div id="question-content" hidden>
            <div class="question-stem markdown" id="question-stem"></div>
            <div class="options-list" id="options-list" role="list"></div>
            <aside class="answer-panel" id="answer-panel" hidden aria-live="polite">
              <span class="answer-label">Reviewed answer</span>
              <strong class="answer-value" id="answer-value"></strong>
              <div class="answer-note markdown" id="answer-note" hidden></div>
            </aside>
          </div>
          <div class="error-state" id="error-state" hidden>
            <strong>Unable to load this question.</strong>
            <p id="error-message"></p>
            <button class="button button-secondary" id="retry-button" type="button">Try again</button>
          </div>
        </section>

        <footer class="question-actions" id="question-actions" hidden>
          <div class="answer-actions">
            <button class="button button-primary" id="reveal-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5c-5.2 0-9.3 4.6-10.5 6.1a1.5 1.5 0 0 0 0 1.8C2.7 14.4 6.8 19 12 19s9.3-4.6 10.5-6.1a1.5 1.5 0 0 0 0-1.8C21.3 9.6 17.2 5 12 5Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
              <span>Reveal answer</span>
            </button>
            <button class="button button-secondary" id="explanation-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a9.5 9.5 0 0 0-8.3 14.1L2.2 20a1.3 1.3 0 0 0 1.6 1.6l4.1-1.4A9.6 9.6 0 1 0 12 2Zm-4 9h8a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2Zm0-4h8a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2Zm0 8h5a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2Z"/></svg>
              Explanation
            </button>
          </div>
          <button class="button button-next" id="next-button" type="button">
            <span>Next question</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.3 5.3 1.4-1.4 8.1 8.1-8.1 8.1-1.4-1.4 6.7-6.7-6.7-6.7Z"/></svg>
          </button>
        </footer>
      </article>
    </main>

    <dialog class="explanation-dialog" id="explanation-dialog" aria-labelledby="dialog-title">
      <div class="dialog-panel">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">CHINESE EXPLANATION</p>
            <h2 id="dialog-title">Question explanation</h2>
          </div>
          <button class="icon-button" id="close-dialog-button" type="button" aria-label="Close explanation">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
          </button>
        </header>
        <div class="dialog-answer" id="dialog-answer"></div>
        <div class="dialog-content markdown" id="dialog-content"></div>
        <footer class="dialog-footer">
          <button class="button button-primary" id="dialog-done-button" type="button">Done</button>
        </footer>
      </div>
    </dialog>
    <noscript>This study site requires JavaScript to load the Markdown question files.</noscript>
  </body>
</html>
